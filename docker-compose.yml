version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: pulsewatch-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secure_pwd_123}
      MYSQL_DATABASE: ${DB_NAME:-pulsewatch}
      MYSQL_USER: ${DB_USER:-pulsewatch}
      MYSQL_PASSWORD: ${DB_PASSWORD:-pulsewatch_secure_pwd}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_secure_pwd_123}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pulsewatch-net

  redis:
    image: redis:7-alpine
    container_name: pulsewatch-redis
    restart: always
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:-}"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pulsewatch-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pulsewatch-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-pulsewatch}
      DB_USER: ${DB_USER:-pulsewatch}
      DB_PASSWORD: ${DB_PASSWORD:-pulsewatch_secure_pwd}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      SMTP_HOST: ${SMTP_HOST:-smtp.sendgrid.net}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    ports:
      - "8080:8080"
    networks:
      - pulsewatch-net

  nginx:
    image: nginx:alpine
    container_name: pulsewatch-nginx
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    networks:
      - pulsewatch-net

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  pulsewatch-net:
    driver: bridge
