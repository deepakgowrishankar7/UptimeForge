services:
  - type: web
    name: uptimeforge
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 8080
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: 2525
      - key: SMTP_USER
        value: be6987001@smtp-brevo.com
      - key: SMTP_PASS
        sync: false
      - key: BREVO_API_KEY
        sync: false
