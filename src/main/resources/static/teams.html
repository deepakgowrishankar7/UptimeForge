<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/assets/logo.png">
  <title>Teams & Collaboration — UptimeForge</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="app-container">
    <div id="sidebar-container"></div>

    <div class="main-wrapper">
      <header class="topbar">
        <h1 class="topbar-title">Teams & Collaboration</h1>
        <div class="topbar-actions">
          <button id="create-team-btn" class="btn btn-primary">+ Create Team</button>
        </div>
      </header>

      <main class="content-body">
        <div class="card">
          <div class="card-header">
            <h2 class="card-title">Your Teams</h2>
            <div style="font-size:12px; color:var(--text-dim);">Collaborate on monitors and shared incident management</div>
          </div>
          <div class="table-responsive">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Team Name</th>
                  <th>Owner</th>
                  <th>Members</th>
                  <th>Created</th>
                  <th style="text-align: right;">Actions</th>
                </tr>
              </thead>
              <tbody id="teams-tbody">
                <tr><td colspan="5" style="text-align:center; color:var(--text-dim); padding:24px;">Loading teams...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Create Team Modal -->
  <div id="team-modal" class="modal-backdrop">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">Create New Team</h3>
        <button class="modal-close" id="close-team-modal">&times;</button>
      </div>
      <form id="team-form">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label">Team Name *</label>
            <input type="text" id="team-name" class="form-control" placeholder="e.g. SRE & Core Infrastructure" required>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="cancel-team-btn">Cancel</button>
          <button type="submit" class="btn btn-primary">Create Team</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Manage Members Modal -->
  <div id="members-modal" class="modal-backdrop">
    <div class="modal-content" style="max-width: 650px;">
      <div class="modal-header">
        <h3 class="modal-title" id="members-modal-title">Team Members</h3>
        <button class="modal-close" id="close-members-modal">&times;</button>
      </div>
      <div class="modal-body">
        <!-- Invite Form -->
        <div style="background:var(--bg-input); padding:16px; border-radius:var(--radius-sm); border:1px solid var(--border-color); margin-bottom:20px;">
          <h4 style="font-size:13px; font-weight:700; margin-bottom:10px; color:var(--text-main);">Invite Team Member</h4>
          <form id="invite-form" style="display:flex; gap:10px;">
            <input type="email" id="invite-email" class="form-control" placeholder="colleague@company.com" required>
            <select id="invite-role" class="form-control" style="width:130px;">
              <option value="MEMBER">Member</option>
              <option value="ADMIN">Admin</option>
            </select>
            <button type="submit" class="btn btn-primary btn-sm">Send Invite</button>
          </form>
        </div>

        <div class="table-responsive">
          <table class="data-table">
            <thead>
              <tr>
                <th>Member</th>
                <th>Role</th>
                <th>Joined</th>
                <th style="text-align: right;">Action</th>
              </tr>
            </thead>
            <tbody id="members-tbody"></tbody>
          </table>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" id="close-members-btn">Close</button>
      </div>
    </div>
  </div>

  <script type="module" src="/js/teams.js"></script>
</body>
</html>
