spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:uptimeforge}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:root}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:deepak098}}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 20000
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
  mail:
    host: ${SMTP_HOST:${SPRING_MAIL_HOST:smtp-relay.brevo.com}}
    port: ${SMTP_PORT:${SPRING_MAIL_PORT:587}}
    username: ${SMTP_USER:${SPRING_MAIL_USERNAME:be6987001@smtp-brevo.com}}
    password: ${SMTP_PASS:${SPRING_MAIL_PASSWORD:}}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: false
          ssl:
            trust: "*"
            protocols: "TLSv1.2 TLSv1.3"
          connectiontimeout: 8000
          timeout: 8000
          writetimeout: 8000

brevo:
  api:
    key: ${BREVO_API_KEY:}

management:
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: false
    mail:
      enabled: false

