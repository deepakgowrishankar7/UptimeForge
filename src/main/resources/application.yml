server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: pulsewatch
  profiles:
    active: dev
  lifecycle:
    timeout-per-shutdown-phase: 15s
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mail:
    host: ${SMTP_HOST:${SPRING_MAIL_HOST:smtp-relay.brevo.com}}
    port: ${SMTP_PORT:${SPRING_MAIL_PORT:587}}
    username: ${SMTP_USER:${SPRING_MAIL_USERNAME:be6987001@smtp-brevo.com}}
    password: ${SMTP_PASS:${SPRING_MAIL_PASSWORD:}}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: false
          ssl:
            trust: "*"
            protocols: "TLSv1.2 TLSv1.3"
          connectiontimeout: 8000
          timeout: 8000
          writetimeout: 8000

pulsewatch:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    access-token-expiration-ms: 900000 # 15 minutes
    refresh-token-expiration-ms: 604800000 # 7 days
  monitoring:
    scheduler-fixed-delay-ms: 5000
    connect-timeout-ms: 10000
    read-timeout-ms: 15000
    max-concurrent-checks: 50
    user-agent: "PulseWatch-Monitor/1.0 (+https://pulsewatch.io/bot)"
  rate-limiting:
    login-max-attempts: 5
    login-window-seconds: 300
    api-requests-per-minute: 120
  security:
    cors:
      allowed-origins:
        - "http://localhost:8080"
        - "http://127.0.0.1:8080"
        - "http://localhost:3000"
  notifications:
    cooldown-minutes: 15
    max-retry-attempts: 3
    retry-delay-ms: 5000

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
